<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אגף [שם] — כלומיון</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Heebo:wght@300;400;700&display=swap');
  :root { --bg:#F7F4EE; --ink:#1A1A18; --muted:#6B6860; --accent:#C8392B; --border:#D4CFC4; --white:#FFFFFF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Heebo',sans-serif; line-height:1.7; }
  header { border-bottom:1px solid var(--border); padding:0 2rem; display:flex; align-items:center; justify-content:space-between; height:64px; background:var(--white); }
  .logo { font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:22px; color:var(--ink); text-decoration:none; }
  .logo span { color:var(--accent); }
  .main { max-width:700px; margin:4rem auto; padding:0 2rem; }
  .breadcrumb { font-size:12px; color:var(--muted); margin-bottom:2rem; }
  .breadcrumb a { color:var(--muted); }
  h1 { font-family:'Frank Ruhl Libre',serif; font-size:52px; font-weight:900; line-height:1; margin-bottom:1.5rem; }
  .content { font-size:16px; color:var(--muted); }
  .sub-list { margin-top:2rem; border-top:1px solid var(--border); }
  .sub-item { padding:1rem 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .sub-item a { color:var(--ink); text-decoration:none; font-size:14px; }
  .sub-item a:hover { text-decoration:underline; }
  .tag { font-size:11px; color:var(--muted); }
  footer { border-top:1px solid var(--border); padding:2rem; font-size:12px; color:var(--muted); text-align:center; margin-top:4rem; }
</style>
</head>
<body>
<header>
  <a class="logo" href="../index.html">כלו<span>מיון</span></a>
</header>
<div class="main">
  <p class="breadcrumb"><a href="../index.html">בית</a> › <a href="../agafim.html">האגפים</a> › אגף [שם]</p>
  <h1>אגף [שם]</h1>
  <div class="content">
    <p>תוכן האגף יתווסף כאן על ידי צוות כלומיון.</p>
    <!-- הוסף תוכן כאן -->
  </div>
  <div class="sub-list">
    <!-- תת-אגפים -->
    <div class="sub-item">
      <a href="#">תת-אגף [שם]</a>
      <span class="tag">בבנייה</span>
    </div>
  </div>
</div>
<footer>© כלומיון — אגף הזכויות (בבנייה)</footer>
</body>
</html>
